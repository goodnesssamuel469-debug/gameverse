<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>GameVerse</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b0a1f">
<style>
:root{--bg:#0b0a1f;--card:#17153a;--tx:#f2f0ff;--mu:#9a96c9;--a:#7c5cff;--b:#ff4fa3;--c:#22d3ee;--bad:#f43f5e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#2a1a6e,transparent 50%),var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:auto;padding:14px}.logo{font-weight:900;font-size:24px;text-align:center;background:linear-gradient(90deg,var(--c),var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 12px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid #fff1}.mu{color:var(--mu);font-size:13px}
.in{width:100%;padding:13px;font-size:16px;border-radius:12px;border:2px solid #fff2;background:#0e0c2b;color:var(--tx);margin:5px 0}
.btn{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));width:100%;margin-top:8px;box-shadow:0 0 18px #7c5cff55}.btn.s{background:#fff1;box-shadow:none}
.hero{background:linear-gradient(135deg,#5b3df5,#d6309a);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 0 30px #7c5cff55}.hero h1,.hero h2{margin:0 0 2px;font-size:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.st{background:#0003;border-radius:12px;padding:8px 4px;text-align:center;font-size:11px}.st b{display:block;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.gc{border:0;border-radius:18px;padding:16px;color:#fff;text-align:left;min-height:116px;box-shadow:0 6px 20px #0006;transition:.15s}.gc:active{transform:scale(.95)}.gc span{font-size:34px;display:block}.gc small{opacity:.9}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0}.chip{flex:none;border:0;border-radius:20px;padding:8px 14px;background:#fff1;color:var(--tx)}.chip.on{background:var(--a)}
nav{position:fixed;bottom:0;left:0;right:0;background:#100e2dee;backdrop-filter:blur(10px);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #fff2;z-index:10}nav.h{display:none}
nav button{border:0;background:none;color:var(--mu);font-size:11px;padding:4px 14px}nav button b{display:block;font-size:22px}nav button.on{color:var(--c)}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:30}.ov.on{display:flex}.sh{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.code{font-size:44px;font-weight:900;letter-spacing:8px;color:var(--c)}.pr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #fff1}.pr .e{font-size:26px}.pr div{flex:1}
.q{font-size:30px;text-align:center;margin:14px 0;min-height:44px}.o{display:block;width:100%;margin:8px 0;padding:14px;font-size:17px;border-radius:12px;border:2px solid #fff2;background:#0e0c2b;color:var(--tx)}
.tm{height:8px;background:#fff2;border-radius:5px;overflow:hidden}.tm i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--b));transition:width 1s linear}
#zone{height:200px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;background:#e11d48;user-select:none;touch-action:manipulation;text-align:center}
.warn{background:#fef3c7;color:#78350f;padding:10px;border-radius:12px;margin:8px 0;font-size:14px}.av{border:0;background:#fff1;border-radius:12px;font-size:24px;padding:6px 8px;margin:2px}.av.on{background:var(--a)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;display:none;max-width:90%;text-align:center}
body.auth nav{display:none}.pop{animation:pop .4s}@keyframes pop{from{transform:scale(.7);opacity:0}}
</style></head><body>
<main><div class="logo">🎮 GAMEVERSE</div><div id="app"></div></main>
<nav id="nav"></nav><div class="ov" id="ov" onclick="if(event.target===this)this.classList.remove('on')"><div class="sh" id="sh"></div></div><div class="toast" id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://whlafkpxrzlubrfmxoxb.supabase.co",SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndobGFma3B4cnpsdWJyZm14b3hiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMzAzOTAsImV4cCI6MjEwNzkwNjM5MH0.ioeW_4Njh10zGCmr0nPVzWmpB36nRCLVet-4J9blhoo";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GM={math:['Math Race','➕','#6c4cff,#3b82f6'],scr:['Word Scramble','🔤','#ec4899,#f97316'],pat:['Pattern Sprint','🧩','#10b981,#06b6d4'],tri:['Trivia Blitz','🧠','#f59e0b,#ef4444'],cap:['Capital Cities','🌍','#0ea5e9,#6366f1'],rea:['Reaction Duel','⚡','#84cc16,#16a34a'],tap:['Speed Tap','👆','#d946ef,#8b5cf6']};
const TRI=[['Largest planet?','Jupiter','Mars','Venus','Saturn'],['Chemical symbol for water?','H2O','CO2','O2','NaCl'],['How many continents?','7','5','6','8'],['Year Nigeria gained independence?','1960','1957','1963','1970'],['Fastest land animal?','Cheetah','Lion','Horse','Leopard'],['Hardest natural substance?','Diamond','Gold','Iron','Quartz'],['Longest river in Africa?','Nile','Niger','Congo','Zambezi'],['Binary digits are called?','Bits','Bytes','Nibbles','Chips'],['Gas plants absorb?','Carbon dioxide','Oxygen','Helium','Nitrogen'],['Colours in a rainbow?','7','5','6','8'],['Nigeria’s largest city?','Lagos','Abuja','Kano','Ibadan'],['Planet nearest the Sun?','Mercury','Venus','Earth','Mars']];
const CAP=[['Nigeria','Abuja','Lagos','Kano','Enugu'],['Ghana','Accra','Kumasi','Lome','Tema'],['Kenya','Nairobi','Mombasa','Kampala','Dodoma'],['Egypt','Cairo','Giza','Luxor','Alexandria'],['France','Paris','Lyon','Nice','Lille'],['Japan','Tokyo','Osaka','Kyoto','Seoul'],['Brazil','Brasília','Rio','São Paulo','Lima'],['Canada','Ottawa','Toronto','Montreal','Calgary'],['South Africa','Pretoria','Durban','Lagos','Harare'],['Senegal','Dakar','Accra','Bamako','Banjul'],['India','New Delhi','Mumbai','Dhaka','Karachi'],['Italy','Rome','Milan','Naples','Turin']];
const WD='planet garden rocket window school bridge market friend yellow orange purple jungle castle silver monkey guitar camera pillow butter flower'.split(' ');
function rng(s){return()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const IMPL={math:'math',scramble:'scr',pattern:'pat',trivia:'tri',capitals:'cap',reaction:'rea',tap:'tap'};
let P=null,GS=[],view='home',cat='All',q='',M=null,PL=[],names={},pt=null,playing=false,cur=null,tm=null,before=null,mode='login',av='🙂',busy=0;
function toast(m){const t=$('t');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)}
function shuf(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(g,seed){const r=rng(seed),R=(a,b)=>a+Math.floor(r()*(b-a+1)),q=[];
if(g==='math')for(let i=0;i<40;i++){const k=Math.min(i/6|0,3),a=R(2,9+k*8),b=R(2,9+k*3);q.push(k===0?[`${a} + ${b}`,a+b]:k===1?[`${a+b} − ${b}`,a]:[`${a} × ${b}`,a*b])}
if(g==='scr')for(const w of shuf(WD,r)){let s=w;for(let t=0;t<9&&s===w;t++)s=shuf([...w],r).join('');q.push([s.toUpperCase(),w])}
if(g==='pat')for(let i=0;i<40;i++){const a=R(1,9),d=R(2,6),m=R(2,3),k=r()<.5,s=k?[a,a+d,a+2*d,a+3*d]:[a,a*m,a*m*m,a*m**3];q.push([s.join(', ')+', ?',k?a+4*d:a*m**4])}
if(g==='tri'||g==='cap')for(const t of shuf(g==='tri'?TRI:CAP,r)){const o=shuf(t.slice(1),r),pre=g==='cap'?'Capital of '+t[0]+'?':t[0];q.push([pre,t[1],o])}
return q}

function ask(){const c=cur,q=c.qs[c.i%c.qs.length],mc=q[2];$('play').innerHTML=`<div class="tm"><i id="tb" style="width:${c.t/45*100}%"></i></div><p class="mu">Score ${c.score}</p><div class="q">${esc(q[0])}</div>`+(mc?mc.map((o,k)=>`<button class="o" onclick="pick(${k})">${esc(o)}</button>`).join(''):`<input class="in" id="a" autocomplete="off" autocapitalize="off" ${c.g==='scr'?'':'inputmode="numeric"'} style="text-align:center;font-size:24px" onkeydown="if(event.key==='Enter')sub()"><button class="btn" onclick="sub()">Check</button>`);const a=$('a');if(a)a.focus()}
function sub(){const q=cur.qs[cur.i%cur.qs.length],v=$('a').value.trim().toLowerCase();if(v===String(q[1])){cur.i++;sc(cur.score+10);ask()}else{$('a').style.borderColor='var(--bad)';$('a').select()}}
function pick(k){const q=cur.qs[cur.i%cur.qs.length];if(q[2][k]===q[1])sc(cur.score+10);cur.i++;ask()}
function rea(){let n=0,tot=0;const r=rng(cur.seed),p=$('play');const round=()=>{if(n>=3)return fin();p.innerHTML=`<p class="mu">Round ${n+1}/3 · Score ${cur.score}</p><div id="zone">Wait for GREEN…</div>`;const z=$('zone');let ready=0,t0=0;const to=setTimeout(()=>{ready=1;z.style.background='#16a34a';z.textContent='TAP NOW!';t0=performance.now()},1500+r()*2500);
z.onpointerdown=()=>{clearTimeout(to);const pts=ready?Math.max(0,Math.round((1000-(performance.now()-t0))/10)):0;z.textContent=ready?Math.round(performance.now()-t0)+' ms (+'+pts+')':'Too early! 0 points';z.onpointerdown=null;n++;sc(cur.score+pts);setTimeout(round,1200)}};round()}
function tap(){let t=10,n=0;const p=$('play');p.innerHTML='<div class="tm"><i id="tb" style="width:100%"></i></div><p class="mu">Tap as fast as you can for 10 seconds!</p><div id="zone" style="background:var(--a);font-size:48px">0</div>';
$('zone').onpointerdown=()=>{if(t>0){n++;$('zone').textContent=n;sc(n)}};tm=setInterval(()=>{t--;$('tb').style.width=t*10+'%';if(t<=0)fin()},1000)}

// ---------- auth ----------
function authUI(){document.body.classList.add('auth');const su=mode==='signup',f=(id,ph,t='text')=>`<input class="in" id="${id}" type="${t}" placeholder="${ph}">`;
$('app').innerHTML=`<div class="card"><div id="am"></div>${su?f('fn','Full name'):''}${f('em','Email address','email')}${f('pw','Password','password')}${su?f('pc','Confirm password','password'):''}<label class="mu"><input type="checkbox" onchange="['pw','pc'].forEach(i=>$(i)&&($(i).type=this.checked?'text':'password'))"> Show password</label><button class="btn" onclick="doAuth()">${su?'Create account':'Log in'}</button><p style="text-align:center">${su?'':'<a href="#" style="color:var(--c)" onclick="forgot();return false">Forgot password?</a><br><br>'}<a href="#" style="color:var(--c)" onclick="mode='${su?'login':'signup'}';authUI();return false">${su?'Have an account? Log in':'New here? Create account'}</a></p></div>`}
function amsg(t){$('am').innerHTML='<div class="warn">'+esc(t)+'</div>'}
async function doAuth(){const em=$('em').value.trim(),pw=$('pw').value;if(!/^\S+@\S+\.\S+$/.test(em))return amsg('Enter a valid email.');if(pw.length<8)return amsg('Password must be at least 8 characters.');
if(mode==='signup'){const fn=$('fn').value.trim();if(fn.length<2)return amsg('Enter your full name.');if(pw!==$('pc').value)return amsg('Passwords do not match.');const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:fn}}});if(error)return amsg(error.message);if(!data.session)return amsg('Account created. Check your email to confirm, then log in.')}
else{const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)return amsg(error.message)}await enter()}
async function forgot(){const em=$('em').value.trim();if(!em)return amsg('Type your email first.');const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href});amsg(error?error.message:'Reset link sent. Check your email.')}
async function loadP(){const u=(await sb.auth.getUser()).data.user;P=(await sb.from('profiles').select('*').eq('id',u.id).single()).data;av=P.avatar}
async function enter(){document.body.classList.remove('auth');await sb.rpc('touch_login');await loadP();const g=await sb.from('games').select('*').eq('active',true);GS=(g.data||[]).filter(x=>IMPL[x.id]);view='home';draw()}
async function logout(){await sb.auth.signOut();location.reload()}
// ---------- screens ----------
function draw(){const inM=!!M;$('nav').className=inM?'h':'';$('nav').innerHTML=[['home','🏠','Home'],['board','🏆','Ranks'],['profile','👤','Profile']].map(([k,i,t])=>`<button class="${view===k?'on':''}" onclick="view='${k}';draw()"><b>${i}</b>${t}</button>`).join('');
if(view==='room')return room();({home,board,profile}[view]||home)()}
function greet(){const h=+new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Lagos',hour:'numeric',hour12:false}).format(new Date())%24,[t,i]=h>=5&&h<12?['Good morning','☀️']:h>=12&&h<17?['Good afternoon','🌤️']:h>=17&&h<21?['Good evening','🌙']:['Good night','✨'];return`${t}, ${esc(P.first_name||'player')}! ${i}`}
function stats(){return`<div class="stats"><div class="st"><b>${Math.floor(P.xp/100)+1}</b>Level</div><div class="st"><b>${P.coins}</b>Coins</div><div class="st"><b>${P.rating}</b>Rating</div><div class="st"><b>${P.wins}/${P.losses}</b>W/L</div></div>`}
function home(){const cats=['All',...new Set(GS.map(g=>g.category))];
$('app').innerHTML=`<div class="hero"><h1>${greet()}</h1><div style="opacity:.85;font-size:13px">${new Intl.DateTimeFormat('en-NG',{timeZone:'Africa/Lagos',dateStyle:'full'}).format(new Date())}</div>${stats()}</div>
<div class="card"><b>Have a room code?</b><div style="display:flex;gap:8px"><input class="in" id="jc" maxlength="6" placeholder="ABC123" style="text-transform:uppercase"><button class="btn" style="width:90px" onclick="joinCode()">Join</button></div></div>
<input class="in" placeholder="🔍 Search games" value="${esc(q)}" oninput="q=this.value.toLowerCase();grid()"><div class="chips">${cats.map(c=>`<button class="chip ${c===cat?'on':''}" onclick="cat='${c}';home()">${c}</button>`).join('')}</div><div class="grid" id="grid"></div>`;grid()}
function grid(){const l=GS.filter(g=>(cat==='All'||g.category===cat)&&(g.name+g.category).toLowerCase().includes(q));$('grid').innerHTML=l.map(g=>`<button class="gc" style="background:linear-gradient(135deg,${GM[IMPL[g.id]][2]})" onclick="sheet('${g.id}')"><span>${g.emoji}</span><b>${esc(g.name)}</b><small>${g.category}</small></button>`).join('')||'<p class="mu">No games match.</p>'}
function sheet(id){const g=GS.find(x=>x.id===id);let o='';for(let n=g.min_players;n<=Math.min(g.max_players,6);n++)o+=`<option>${n}</option>`;$('sh').innerHTML=`<h3>${g.emoji} ${esc(g.name)}</h3><p class="mu">${g.min_players}–${g.max_players} players · ${g.duration_s}s · same questions for everyone</p><button class="btn" onclick="qm('${id}')">⚡ Quick Match (public)</button><p class="mu">Or play with friends:</p><select class="in" id="sz">${o}</select><button class="btn s" onclick="mk('${id}')">🔒 Create private room</button>`;$('ov').classList.add('on')}
async function board(){$('app').innerHTML='<div class="card">Loading…</div>';const r=await sb.from('public_profiles').select('*').order('rating',{ascending:false}).limit(50);
$('app').innerHTML='<div class="card"><h3 style="margin-top:0">🏆 Top players</h3>'+((r.data||[]).map((p,i)=>`<div class="pr"><span>${['🥇','🥈','🥉'][i]||i+1}</span><span class="e">${esc(p.avatar)}</span><div>@${esc(p.username)}${p.id===P.id?' (you)':''}<br><span class="mu">${p.wins}W · ${p.losses}L</span></div><b>${p.rating}</b></div>`).join('')||'<p class="mu">No players yet.</p>')+'</div>'}
function profile(){const AV='🙂😎🤩🥷🧑‍🚀🦊🐼🦁🐯👾🤖🔥'.match(/\p{Extended_Pictographic}(\u200d\p{Extended_Pictographic})*/gu);
$('app').innerHTML=`<div class="hero" style="text-align:center"><div style="font-size:60px">${esc(P.avatar)}</div><h2>@${esc(P.username)}</h2>${esc(P.full_name)}<br><span style="opacity:.85">${esc(P.bio)}</span>${stats()}<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="st"><b>${P.xp}</b>XP</div><div class="st"><b>${P.matches_played}</b>Matches</div><div class="st"><b>🔥${P.streak}</b>Streak</div></div></div>
<div class="card"><b>Edit profile</b><input class="in" id="pu" placeholder="Username" value="${esc(P.username)}"><input class="in" id="pf" placeholder="Full name" value="${esc(P.full_name)}"><input class="in" id="pb" placeholder="Short bio" maxlength="160" value="${esc(P.bio)}"><div>${AV.map(a=>`<button class="av ${a===av?'on':''}" onclick="av='${a}';profile()">${a}</button>`).join('')}</div><button class="btn" onclick="saveP()">Save changes</button><button class="btn s" onclick="logout()">Log out</button></div>`}
async function saveP(){const{error}=await sb.rpc('set_profile',{p_username:$('pu').value,p_full_name:$('pf').value,p_avatar:av,p_bio:$('pb').value});if(error)return toast(error.message);await loadP();toast('Saved ✓');profile()}
// ---------- matches ----------
function handle(r){if(r.error)return toast(r.error.message);$('ov').classList.remove('on');M=r.data;playing=false;PL=[];before={xp:P.xp,coins:P.coins,rating:P.rating};view='room';draw();clearInterval(pt);pt=setInterval(poll,1500);poll()}
const qm=async g=>handle(await sb.rpc('quick_match',{p_game:g})),mk=async g=>handle(await sb.rpc('create_match',{p_game:g,p_public:false,p_max:+$('sz').value})),joinCode=async()=>{const c=$('jc').value.trim();if(c.length<4)return toast('Enter the room code');handle(await sb.rpc('join_match',{p_code:c}))};
async function poll(){if(!M)return;const[m,pl]=await Promise.all([sb.from('matches').select('*').eq('id',M.id).maybeSingle(),sb.from('match_players').select('*').eq('match_id',M.id)]);if(!m.data)return exitM();M=m.data;PL=pl.data||[];const need=PL.map(p=>p.user_id).filter(i=>!names[i]);
if(need.length){const r=await sb.from('public_profiles').select('id,username,avatar').in('id',need);(r.data||[]).forEach(x=>names[x.id]=x)}
if(M.status==='waiting'&&!playing)room();else if(M.status==='playing'&&!playing)startGame();else lb()}
const nm=id=>names[id]||{username:'player',avatar:'🙂'};
function room(){if(!M||view!=='room')return;const g=GS.find(x=>x.id===M.game_id)||{name:'Match',min_players:2},host=M.host_id===P.id;
$('app').innerHTML=`<div class="card" style="text-align:center"><div class="mu">${esc(g.name)} · ${M.is_public?'Public match':'Private room'}</div><div class="code">${M.code}</div><button class="btn s" onclick="shareCode()">📤 Share code</button></div><div class="card"><b>Players ${PL.length}/${M.max_players}</b>${PL.map(p=>`<div class="pr"><span class="e">${esc(nm(p.user_id).avatar)}</span><div>@${esc(nm(p.user_id).username)}${p.user_id===P.id?' (you)':''}</div>${p.user_id===M.host_id?'👑':''}</div>`).join('')}</div>${host?`<button class="btn" onclick="startM()">▶ Start match${PL.length<g.min_players?` (need ${g.min_players})`:''}</button>`:'<p class="mu" style="text-align:center">Waiting for the host to start…</p>'}<button class="btn s" onclick="leave()">Leave room</button>`}
async function startM(){const r=await sb.rpc('start_match',{p_id:M.id});if(r.error)toast(r.error.message)}
function shareCode(){const t='Join my GameVerse match! Room code: '+M.code;navigator.share?navigator.share({text:t}).catch(()=>{}):(navigator.clipboard&&navigator.clipboard.writeText(t),toast('Copied ✓'))}
function exitM(){clearInterval(pt);clearInterval(tm);M=null;playing=false;view='home';draw()}
async function leave(){if(M)await sb.rpc('leave_match',{p_id:M.id});exitM()}
function startGame(){playing=true;$('nav').className='h';cur={g:IMPL[M.game_id],seed:M.seed,score:0,i:0,t:45,over:0};
$('app').innerHTML='<div class="card" id="play"></div><div class="card"><b>Live scores</b><div id="lb"></div></div>';$('play').innerHTML=`<div class="q">${GM[cur.g][1]} ${GM[cur.g][0]}<br><span class="mu">Get ready…</span></div>`;
setTimeout(run,Math.max(0,Math.min(5000,new Date(M.started_at)-Date.now())));lb()}
function run(){const g=cur.g;if(g==='rea')return rea();if(g==='tap')return tap();cur.qs=build(g,cur.seed);cur.t=45;tm=setInterval(()=>{cur.t--;const b=$('tb');if(b)b.style.width=cur.t/45*100+'%';if(cur.t<=0)fin()},1000);ask()}
function lb(){const e=$('lb');if(!e)return;e.innerHTML=[...PL].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="pr"><span>${i+1}</span><span class="e">${esc(nm(p.user_id).avatar)}</span><div>@${esc(nm(p.user_id).username)}${p.user_id===P.id?' (you)':''}</div><b>${p.score}</b></div>`).join('')}
async function sc(n){cur.score=n;if(busy)return;busy=1;await sb.rpc('submit_score',{p_id:M.id,p_score:cur.score});busy=0}
function fin(){clearInterval(tm);if(cur.over)return;cur.over=1;$('play').innerHTML=`<div class="q">🏁 Done!<br>Score <b>${cur.score}</b></div><p class="mu" style="text-align:center">Waiting for the other players…</p>`;settle()}
async function settle(){await sb.rpc('submit_score',{p_id:M.id,p_score:cur.score});for(let i=0;i<30;i++){const r=await sb.rpc('finish_match',{p_id:M.id});if(r.data&&r.data.settled)break;await new Promise(r=>setTimeout(r,2000))}results()}
async function results(){clearInterval(pt);const pl=(await sb.from('match_players').select('*').eq('match_id',M.id)).data||[];await loadP();const d={xp:P.xp-before.xp,c:P.coins-before.coins,r:P.rating-before.rating};
$('app').innerHTML=`<div class="card pop" style="text-align:center"><div style="font-size:54px">🏆</div><h2 style="margin:0">Match complete!</h2><p>+${d.xp} XP · +${d.c} coins · rating ${d.r>=0?'+':''}${d.r}</p></div><div class="card">${[...pl].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="pr"><span>${['🥇','🥈','🥉'][i]||i+1}</span><span class="e">${esc(nm(p.user_id).avatar)}</span><div>@${esc(nm(p.user_id).username)}${p.user_id===P.id?' (you)':''}</div><b>${p.score}</b></div>`).join('')}</div><button class="btn" onclick="M=null;playing=false;view='home';draw()">Back to games</button>`}
(async()=>{authUI();const{data:{session}}=await sb.auth.getSession();if(session)enter()})();
</script></body></html>
